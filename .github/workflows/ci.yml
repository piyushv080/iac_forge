name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  sanity:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ansible: [stable-2.17, stable-2.18, milestone]
    steps:
      # ansible-test needs the collection at ansible_collections/<namespace>/<name>
      - uses: actions/checkout@v4
        with:
          path: ansible_collections/iacforge/snowflake_iac
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install https://github.com/ansible/ansible/archive/${{ matrix.ansible }}.tar.gz
      - name: Sanity tests
        working-directory: ansible_collections/iacforge/snowflake_iac
        run: ansible-test sanity --docker -v --color
      - name: Unit tests
        working-directory: ansible_collections/iacforge/snowflake_iac
        run: ansible-test units --docker -v --color

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ansible-core
      - run: ansible-galaxy collection build
      - run: ansible-galaxy collection install iacforge-snowflake_iac-*.tar.gz -p /tmp/collections
      - run: ANSIBLE_COLLECTIONS_PATH=/tmp/collections ansible-doc -l iacforge.snowflake_iac
