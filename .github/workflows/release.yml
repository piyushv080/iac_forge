name: release

# Push a tag like v0.1.0 (must match version in galaxy.yml) to publish to Ansible Galaxy.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ansible-core pyyaml

      - name: Tag must match galaxy.yml version
        run: |
          v=$(python -c "import yaml;print(yaml.safe_load(open('galaxy.yml'))['version'])")
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != galaxy.yml version $v"; exit 1; }

      - name: Build
        run: ansible-galaxy collection build

      - name: Publish to Ansible Galaxy
        run: ansible-galaxy collection publish iacforge-snowflake_iac-*.tar.gz --api-key "${{ secrets.GALAXY_API_KEY }}"

      - name: Attach tarball to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: iacforge-snowflake_iac-*.tar.gz
          generate_release_notes: true
