name: release

# Tag format: <collection>-v<version>   e.g.  snowflake_iac-v0.1.0
on:
  push:
    tags: ["*-v*"]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ansible-core pyyaml

      - name: Resolve collection from tag
        run: |
          tag="${GITHUB_REF_NAME}"
          coll="${tag%-v*}"; ver="${tag##*-v}"
          dir="ansible_collections/iacforge/${coll}"
          [ -f "${dir}/galaxy.yml" ] || { echo "no collection '${coll}'"; exit 1; }
          v=$(python -c "import yaml;print(yaml.safe_load(open('${dir}/galaxy.yml'))['version'])")
          [ "$v" = "$ver" ] || { echo "tag version ${ver} != galaxy.yml version ${v}"; exit 1; }
          echo "COLL_DIR=${dir}" >> "$GITHUB_ENV"

      - run: ansible-galaxy collection build "$COLL_DIR" --output-path dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          generate_release_notes: true
